<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07080F">
<meta name="apple-mobile-web-app-title" content="Tefilín">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Registra tus tefilín cada día, mantén tu racha y motiva a tus amigos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Tefilín</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
:root{
  --bg:#F2F2F7; --card:#fff; --label:#000; --label2:#3C3C4399; --sep:#3C3C4349; --fill:#7878801f;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30; --accent:#FF9F0A; --bar:#f9f9f9d6;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000; --card:#1C1C1E; --label:#fff; --label2:#EBEBF599; --sep:#54545899; --fill:#7878805c; --bar:#1d1d1dd6; --accent:#FF9F0A;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--label);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}

/* ---- escenario: marco de iPhone en escritorio, pantalla completa en móvil ---- */
#stage{min-height:100%;display:flex;align-items:center;justify-content:center;background:#d8d8de}
@media (prefers-color-scheme:dark){#stage{background:#111}}
#phone{position:relative;width:390px;height:844px;background:var(--bg);overflow:hidden;border-radius:55px;
  box-shadow:0 0 0 11px #1a1a1c,0 0 0 13px #3a3a3d,0 40px 80px #0006}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:50}
#status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;
  padding:6px 32px 0 40px;font-weight:600;font-size:16px;z-index:40;pointer-events:none}
#homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:var(--label);opacity:.9;z-index:60;pointer-events:none}
@media (max-width:500px){
  #stage{background:var(--bg);display:block}
  #phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  #island,#status,#homebar{display:none}
}
:root{--top:54px;--bottom:34px}
@media (max-width:500px){:root{--top:env(safe-area-inset-top);--bottom:env(safe-area-inset-bottom)}}

#screen{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--top) + 8px) 16px calc(var(--bottom) + 96px);scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
#screen.chat{padding:0}

/* ---- tab bar ---- */
#tabbar{position:absolute;left:0;right:0;bottom:0;padding:8px 0 calc(var(--bottom) - 6px);display:flex;background:var(--bar);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid var(--sep);z-index:30}
#tabbar.hide{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#8E8E93}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{fill:currentColor;fill-opacity:.18}

/* ---- tipografía iOS ---- */
h1.large{font-size:34px;font-weight:700;letter-spacing:.37px;margin:6px 4px 2px}
.sub{color:var(--label2);font-size:15px;margin:0 4px 14px}
.cap{font-size:13px;color:var(--label2);text-transform:uppercase;margin:22px 16px 6px;letter-spacing:-.08px}
.foot{font-size:13px;color:var(--label2);margin:6px 16px 0;line-height:1.35}

/* ---- tarjetas / listas agrupadas ---- */
.card{background:var(--card);border-radius:12px;overflow:hidden}
.pad{padding:16px}
.row{display:flex;align-items:center;min-height:44px;padding:0 16px;gap:12px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .grow{flex:1}
.row .val{color:var(--label2)}
.row small{display:block;color:var(--label2);font-size:13px}
.row.tall{padding-top:8px;padding-bottom:8px}
.chev::after{content:"›";color:#C7C7CC;font-size:22px;margin-left:4px}
.destr{color:var(--red)}
.link{color:var(--blue)}

.btn{display:block;width:100%;background:var(--accent);color:#000;font-weight:600;font-size:17px;padding:15px;border-radius:14px;text-align:center}
.btn.tint{background:var(--fill);color:var(--blue)}
.btn:active{opacity:.7}
.btn[disabled]{opacity:.4}
.field{width:100%;border:0;background:transparent;outline:0;font-size:17px;padding:12px 0}

/* switch */
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:#78788052;transition:.25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0004;transition:.25s}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}

/* ---- Hoy ---- */
.hero{display:flex;flex-direction:column;align-items:center;padding:22px 16px 18px;text-align:center}
.ring{position:relative;width:200px;height:200px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:14;stroke-linecap:round}
.ring .bg{stroke:var(--fill)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.ring .flame{font-size:30px;animation:pulse 1.8s ease-in-out infinite}
.ring .flame.off{filter:grayscale(1);opacity:.4;animation:none}
@keyframes pulse{50%{transform:scale(1.14)}}
.hero .lbl{font-weight:600;color:var(--accent);margin-top:10px;font-size:17px}
.hero .meta{color:var(--label2);font-size:14px;margin-top:4px}
.shot{width:150px;height:190px;object-fit:cover;border-radius:14px;margin:10px auto 0;display:block}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.center{text-align:center}
.big-emoji{font-size:40px}

/* ---- Historial ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px}
.mhead b{font-size:20px;text-transform:capitalize}
.mhead button{font-size:30px;color:var(--accent);padding:0 10px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px}
.wd{text-align:center;font-size:12px;font-weight:600;color:var(--label2)}
.day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.day.done{background:var(--accent);color:#000;font-weight:700}
.day.ex{background:var(--fill)}
.day.miss{box-shadow:inset 0 0 0 1.5px var(--red)}
.day.fut{opacity:.3}
.day.today{box-shadow:inset 0 0 0 2px var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--label2);padding:12px 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* ---- Chat ---- */
.navbar{position:absolute;top:0;left:0;right:0;padding:calc(var(--top) + 2px) 8px 8px;display:flex;align-items:center;justify-content:space-between;
  background:var(--bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:.5px solid var(--sep);z-index:20}
.navbar .back{color:var(--blue);font-size:17px;min-width:70px}
.navbar b{font-size:17px}
.navbar .more{min-width:70px;text-align:right;color:var(--blue);font-size:22px}
#msgs{position:absolute;top:calc(var(--top) + 46px);bottom:calc(var(--bottom) + 56px);left:0;right:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:3px}
.b{max-width:75%;padding:8px 13px;border-radius:18px;font-size:17px;line-height:1.25;word-wrap:break-word}
.b.me{align-self:flex-end;background:var(--blue);color:#fff}
.b.them{align-self:flex-start;background:var(--fill)}
.b.nudge{outline:2px solid var(--accent)}
#composer{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(var(--bottom) - 8px);display:flex;gap:8px;align-items:center;background:var(--bar);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:.5px solid var(--sep)}
#composer input{flex:1;border:.5px solid var(--sep);background:transparent;border-radius:18px;padding:8px 14px;outline:0;font-size:17px}
#composer button{color:var(--blue);font-weight:600;font-size:17px}
#composer .nd{font-size:22px}

/* ---- hojas y alertas ---- */
#overlay{position:absolute;inset:0;background:#0006;z-index:70;display:none;align-items:flex-end;justify-content:center;animation:fade .2s}
#overlay.on{display:flex}
#overlay.mid{align-items:center}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;padding:8px 8px calc(var(--bottom) + 4px);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grp{background:var(--bar);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet .grp>*{display:block;width:100%;padding:17px;font-size:20px;text-align:center;color:var(--blue)}
.sheet .grp>*+*{border-top:.5px solid var(--sep)}
.sheet .grp .t{font-size:13px;color:var(--label2);padding:14px}
.sheet .grp .destr{color:var(--red)}
.sheet .grp .bold{font-weight:600}
.alert{width:270px;background:var(--bar);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:14px;text-align:center;overflow:hidden;animation:pop .25s}
.alert .tx{padding:18px 16px}
.alert h4{margin:0 0 4px;font-size:17px}
.alert p{margin:0;font-size:13px}
.alert .bt{display:flex;border-top:.5px solid var(--sep)}
.alert .bt button{flex:1;padding:12px;font-size:17px;color:var(--blue)}
.alert .bt button+button{border-left:.5px solid var(--sep)}
.alert .bt .destr{color:var(--red)}.alert .bt .bold{font-weight:600}
.photo-view{max-width:88%;max-height:70%;border-radius:16px}

/* =====================================================
   TEMA 2 · oscuro, cristal, aurora y partículas
   (efectos portados de React Bits; animación con GSAP; scroll con Lenis)
   ===================================================== */
:root,:root[data-x]{
  --bg:#07080F; --card:#ffffff0d; --label:#F5F5F7; --label2:#EBEBF59e; --sep:#ffffff1c; --fill:#ffffff14;
  --blue:#8AB4FF; --accent:#FFB62E; --bar:#15162399; --red:#FF6B6B;
  --grad:linear-gradient(135deg,#FFE08A 0%,#FFB62E 45%,#FF7A3D 100%);
}
@media (prefers-color-scheme:light){:root{--bg:#07080F;--card:#ffffff0d;--label:#F5F5F7;--label2:#EBEBF59e;--sep:#ffffff1c;--fill:#ffffff14;--bar:#15162399}}
#stage{background:radial-gradient(circle at 50% 30%,#1a1b2e,#05050a)}
#phone{background:var(--bg);color:var(--label);isolation:isolate}
#aurora{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
#aurora i:nth-child(1){width:340px;height:340px;left:-90px;top:-60px;background:#3d36ff}
#aurora i:nth-child(2){width:300px;height:300px;right:-110px;top:180px;background:#9b3dff;opacity:.4}
#aurora i:nth-child(3){width:320px;height:320px;left:30px;bottom:-120px;background:#ff9a1f;opacity:.32}
canvas.layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#confetti{z-index:66}
#screen{z-index:2;overscroll-behavior:contain}
#content{padding:calc(var(--top) + 8px) 16px calc(var(--bottom) + 104px);min-height:100%}
#screen.chat{overflow:hidden}#screen.chat #content{padding:0}
#screen{padding:0!important}

/* título degradado animado (GradientText) */
h1.large{background:linear-gradient(90deg,#fff,#FFE08A,#FFB62E,#fff);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:gshift 7s linear infinite}
@keyframes gshift{to{background-position:-250% 0}}
.sub{color:var(--label2)}

/* barra superior que aparece al hacer scroll */
#topbar{position:absolute;top:0;left:0;right:0;height:calc(var(--top) + 44px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:11px;
  background:var(--bar);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid var(--sep);
  font-weight:600;font-size:17px;opacity:0;z-index:25;pointer-events:none}
#phone.inchat #topbar{display:none}

/* cristal + foco de luz (SpotlightCard) */
.card{position:relative;background:var(--card);border:1px solid #ffffff1a;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 10px 30px #0006,inset 0 1px 0 #ffffff14;border-radius:20px}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),#FFB62E26,transparent 70%)}
.card:hover::before{opacity:1}
.row+.row::before{border-top:1px solid #ffffff12}
.row .val,.row small{color:var(--label2)}

/* botón con brillo (ShinyText) + imán (Magnet) */
.btn{background:var(--grad);color:#1a1000;position:relative;overflow:hidden;border-radius:16px;box-shadow:0 8px 24px #FF9F0A55,inset 0 1px 0 #fff8;will-change:transform;transition:box-shadow .3s}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,#fff9,transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-80%}100%{left:140%}}
.btn:active{transform:scale(.97)}

/* tab bar flotante tipo cristal líquido */
#tabbar{left:14px;right:14px;bottom:calc(var(--bottom) - 8px);padding:6px;border-radius:34px;border:1px solid #ffffff22;
  background:#16172199;box-shadow:0 14px 40px #000a,inset 0 1px 0 #ffffff1f}
@media (max-width:500px){#tabbar{bottom:max(10px,calc(env(safe-area-inset-bottom) - 6px))}}
#tabbar .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:28px;
  background:linear-gradient(180deg,#ffffff26,#ffffff10);box-shadow:inset 0 1px 0 #ffffff33,0 4px 14px #0006;transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.tab{position:relative;padding:7px 0 6px;color:#9a9ab0;transition:color .25s,transform .25s}
.tab.on{color:var(--accent)}
.tab:active{transform:scale(.9)}
.tab svg{transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.tab.on svg{transform:translateY(-1px) scale(1.12);fill-opacity:.28}

/* anillo de racha */
.hero{padding:26px 16px 20px;overflow:hidden}
.halo{position:absolute;left:50%;top:128px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;
  background:radial-gradient(circle,#FFB62E40,transparent 65%);animation:halo 3.2s ease-in-out infinite;pointer-events:none}
@keyframes halo{50%{transform:scale(1.18);opacity:.65}}
.ring{filter:drop-shadow(0 0 14px #FFB62E55)}
.ring circle{stroke-width:13}
.ring .fg{stroke:url(#rg)}
.ring .num{font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.hero .lbl{letter-spacing:.2px}

/* tira semanal */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 12px}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--label2)}
.wk b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--fill);color:var(--label)}
.wk.done b{background:var(--grad);color:#1a1000}
.wk.miss b{box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red)}
.wk.today b{box-shadow:0 0 0 2px #ffffffaa}
.wk.done.today b{box-shadow:0 0 0 2px #ffffffaa,0 0 16px #FFB62E99}

/* logros */
.badges{display:flex;gap:10px;overflow-x:auto;padding:14px 14px 16px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:none;width:76px;text-align:center;font-size:12px;color:var(--label2)}
.badge i{display:flex;width:56px;height:56px;margin:0 auto 6px;border-radius:18px;align-items:center;justify-content:center;font-style:normal;font-size:26px;
  background:var(--fill);filter:grayscale(1);opacity:.45}
.badge.on i{background:linear-gradient(135deg,#ffe08a33,#ff7a3d33);box-shadow:inset 0 0 0 1px #FFB62E66,0 0 18px #FFB62E33;filter:none;opacity:1}
.badge.on{color:var(--label)}

.day.done{background:var(--grad);color:#1a1000;box-shadow:0 0 12px #FFB62E55}
.day.today{box-shadow:inset 0 0 0 2px #fff}
.chip{padding:7px 13px;border-radius:15px;background:var(--fill);font-size:15px;color:var(--label)}
.chip.on{background:var(--grad);color:#1a1000;font-weight:700}
.row .chip+.chip{margin-left:-4px}
.post{padding:0;margin-bottom:14px}
.post img{width:100%;display:block;max-height:440px;object-fit:cover;background:var(--fill)}
.pinfo{padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pinfo small{margin-left:auto;color:var(--label2);font-size:13px}
.pinfo .destr{font-size:14px}
.gsel{color:var(--green)!important;text-align:left!important;padding-left:24px!important}
.gsel:not(.on){color:var(--label2)!important}
.b.me{background:linear-gradient(135deg,#5B7CFF,#8A5BFF)}
.b.them{background:#ffffff18}
.sw.on{background:linear-gradient(135deg,#5EE08A,#34C759)}
.sheet .grp,.alert{background:#1a1b2ccc;border:1px solid #ffffff1a}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="island"></div>
    <div id="status"><span id="clock">9:41</span><span>100% 🔋</span></div>
    <div id="aurora"><i></i><i></i><i></i></div>
    <div id="topbar"></div>
    <div id="screen"><div id="content"></div></div>
    <canvas id="confetti" class="layer"></canvas>
    <nav id="tabbar"></nav>
    <div id="homebar"></div>
    <div id="overlay"></div>
  </div>
</div>
<input id="file" type="file" accept="image/*" capture="user" hidden>

<script>
/* =========================================================
   Config de Supabase (opcional, para amigos y chat).
   Pega aquí tu URL y anon key, o configúralas en Ajustes.
   ========================================================= */
const CFG = {
  url: 'https://mjmfuurbqtybdldreokk.supabase.co',   // https://TU-PROYECTO.supabase.co
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qbWZ1dXJicXR5YmRsZHJlb2trIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTcwMjUsImV4cCI6MjEwNzQ3MzAyNX0.ClR1QrXj3E2x9pAi-NZ5JFOREUSR_sFpRebw4v9tksA',   // anon key (pública)
  vapid: 'BJKi4AgCeIhR7twaknPSIzXMzQX-CJDKxQ-2CIndi6CXs8S1U5qbbQu9FoPvv1urvlhbXRRPU5YNIhYI4d5XbeY', // clave pública de avisos push
};

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const MILESTONES = [3, 7, 14, 30, 50, 100, 180, 365, 500, 1000];

/* ---------- estado persistente ---------- */
const KEY = 'tefilin-web:v1';
const saved = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } })();
const S = {

/* ---------- calendario judío (sin dependencias, vía Intl) ---------- */
const hebFmt = new Intl.DateTimeFormat('en-u-ca-hebrew', { day: 'numeric', month: 'long' });
function hebParts(d) {
  const p = hebFmt.formatToParts(d);
  const day = +p.find(x => x.type === 'day').value;
  const m = p.find(x => x.type === 'month').value.toLowerCase();
  const month = m.startsWith('tish') ? 'tishrei' : m.startsWith('nis') ? 'nisan' : m.startsWith('siv') ? 'sivan' : m === 'av' ? 'av' : m;
  return { day, month };
}
function hebrewString(d) {
  return new Intl.DateTimeFormat('he-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
}
function dayInfo(d) {
  if (d.getDay() === 6) return { exempt: true, reason: 'Shabbat' };
  const { day, month } = hebParts(d), il = S.settings.israel, skipChm = S.settings.chm === 'skip';
  const yt = r => ({ exempt: true, reason: 'Yom Tov · ' + r });
  const chm = r => skipChm ? { exempt: true, reason: 'Jol HaMoed · ' + r } : { exempt: false, reason: null };
  if (month === 'tishrei') {
    if (day === 1 || day === 2) return yt('Rosh Hashaná');
    if (day === 10) return yt('Yom Kipur');
    if (day === 15) return yt('Sucot');
    if (day === 16) return il ? chm('Sucot') : yt('Sucot II');
    if (day >= 17 && day <= 21) return chm('Sucot');
    if (day === 22) return yt('Shemini Atzeret');
    if (day === 23 && !il) return yt('Simjat Torá');
  } else if (month === 'nisan') {
    if (day === 15) return yt('Pésaj');
    if (day === 16) return il ? chm('Pésaj') : yt('Pésaj II');
    if (day >= 17 && day <= 20) return chm('Pésaj');
    if (day === 21) return yt('Pésaj VII');
    if (day === 22 && !il) return yt('Pésaj VIII');
  } else if (month === 'sivan') {
    if (day === 6) return yt('Shavuot');
    if (day === 7 && !il) return yt('Shavuot II');
  } else if (month === 'av') {
    if (day === 9 || (day === 10 && d.getDay() === 0)) return { exempt: true, reason: "Tisha B'Av (tefilín solo en Minjá)" };
  }
  return { exempt: false, reason: null };
}

/* ---------- racha ---------- */
function computeStreaks(now = new Date()) {
  const keys = Object.keys(S.checkins).sort();
  if (!keys.length) return { current: 0, best: 0 };
  const today = midnight(now), tk = key(today), first = parseKey(keys[0]);
  let current = 0;
  for (const d = new Date(today); d >= first; d.setDate(d.getDate() - 1)) {
    const k = key(d);
    if (S.checkins[k]) current++;
    else if (dayInfo(d).exempt || k === tk) continue;
    else break;
  }
  let best = 0, run = 0;
  for (const d = new Date(first); d <= today; d.setDate(d.getDate() + 1)) {
    const k = key(d);
    if (S.checkins[k]) best = Math.max(best, ++run);
    else if (!(dayInfo(d).exempt || k === tk)) run = 0;
  }
  return { current, best: Math.max(best, current) };
}
let serverBest = 0;
const stats = () => { const s = computeStreaks(); return { streak: s.current, best: Math.max(s.best, serverBest) }; };

  // tira de los últimos 7 días

function shrink(file) {   // → Blob JPEG (máx. 720 px)
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, 720 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * r; c.height = img.height * r;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => res(b), 'image/jpeg', 0.72);
    };
    img.onerror = () => res(null); img.src = url;
  });
}

async function loadFriends() {
  if (!sb || !session) return;
  const me = session.user.id;
  const { data: rows } = await sb.from('friendships').select('*').or(`requester.eq.${me},addressee.eq.${me}`);
  const fs = rows ?? [], ids = [...new Set(fs.map(f => f.requester === me ? f.addressee : f.requester))];
  const { data: profs } = ids.length ? await sb.from('profiles').select('id,username,streak,best_streak,last_checkin').in('id', ids) : { data: [] };
  const by = new Map((profs ?? []).map(p => [p.id, p]));
  const nf = fs.filter(f => f.status === 'accepted').flatMap(f => by.get(f.requester === me ? f.addressee : f.requester) ?? []);
  const ni = fs.filter(f => f.status === 'pending' && f.addressee === me).map(f => ({ ...f, profile: by.get(f.requester) }));
  if (JSON.stringify([nf, ni]) !== JSON.stringify([friends, incoming]) && tab === 'amigos' && !chat) { friends = nf; incoming = ni; render(); }
  else { friends = nf; incoming = ni; }
}

/* ---------- Chat ---------- */
async function renderChat() {
  const me = session.user.id, fid = chat.id;
  $('#content').innerHTML = `
    <div class="navbar"><button class="back" id="back">‹ Amigos</button><b>${esc(chat.username)}</b><button class="more" id="more">⋯</button></div>
    <div id="msgs" data-lenis-prevent></div>
    <div id="composer"><button class="nd" id="nudge" title="Recordarle">👊</button><input id="txt" placeholder="Mensaje" enterkeyhint="send"><button id="send">Enviar</button></div>`;
  const paint = () => {
    const box = $('#msgs'); if (!box) return;
    box.innerHTML = chat.msgs.map(m => `<div class="b ${m.sender === me ? 'me' : 'them'} ${m.kind === 'nudge' ? 'nudge' : ''}">${esc(m.body)}</div>`).join('');
    box.scrollTop = box.scrollHeight;
  };
  const send = async (body, kind = 'text') => {
    if (!body.trim()) return;
    const { data } = await sb.from('messages').insert({ sender: me, receiver: fid, body: body.trim(), kind }).select().single();
    if (data) { chat.msgs.push(data); paint(); }
  };
  const { data } = await sb.from('messages').select('*')
    .or(`and(sender.eq.${me},receiver.eq.${fid}),and(sender.eq.${fid},receiver.eq.${me})`).order('created_at', { ascending: false }).limit(100);
  chat.msgs = (data ?? []).reverse(); paint();
  if (channel) sb.removeChannel(channel);
  channel = sb.channel(`chat:${me}:${fid}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `receiver=eq.${me}` }, p => {
    const m = p.new; if (m.sender === fid && !chat.msgs.some(x => x.id === m.id)) { chat.msgs.push(m); paint(); }
  }).subscribe();
  const doSend = () => { const t = $('#txt'); send(t.value); t.value = ''; };
  $('#send').onclick = doSend;
  $('#txt').onkeydown = e => { if (e.key === 'Enter') doSend(); };
  $('#nudge').onclick = () => send('¡Ponte los tefilín! 👊 No rompas la racha.', 'nudge');
  $('#back').onclick = () => { if (channel) sb.removeChannel(channel); channel = null; chat = null; render(); loadFriends(); };
  $('#more').onclick = () => actionSheet(chat.username, [
    { label: 'Reportar usuario', run: async () => { await sb.from('reports').insert({ reporter: me, reported: fid, reason: 'Contenido inapropiado' }); alertBox('Gracias', 'Revisaremos tu reporte.'); } },
    { label: 'Bloquear y eliminar amigo', destructive: true, run: async () => {
      await sb.from('blocks').upsert({ blocker: me, blocked: fid });
      await sb.from('friendships').delete().or(`and(requester.eq.${me},addressee.eq.${fid}),and(requester.eq.${fid},addressee.eq.${me})`);
      $('#back').click();
    } },
  ]);
}

// Restaurar / subir los registros diarios (la racha sobrevive a reinstalar)
async function syncCheckins() {
  if (!sb || !session) return;
  const { data } = await sb.from('checkins').select('day');   // RLS: solo los míos
  const remote = new Set((data ?? []).map(r => r.day));
  let changed = false;
  for (const d of remote) if (!S.checkins[d]) { S.checkins[d] = { at: d }; changed = true; }
  const missing = Object.keys(S.checkins).filter(d => !remote.has(d)).map(day => ({ user_id: session.user.id, day }));
  if (missing.length) await sb.from('checkins').upsert(missing);
  if (changed) { persist(); if (!chat) render(); }
}

// Avisos push: el servidor envía a la hora elegida, saltando Shabbat/festividades y los días ya registrados
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
async function enablePush() {
  const vapid = S.supa.vapid || CFG.vapid;
  if (!sb || !session || !vapid || !('PushManager' in window) || !('serviceWorker' in navigator)) return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(vapid) });
    const j = sub.toJSON();
    const { error } = await sb.from('push_subs').upsert({ endpoint: j.endpoint, user_id: session.user.id, p256dh: j.keys.p256dh, auth: j.keys.auth });
    if (error) return false;
    S.pushOn = true; persist(); await syncReminders(); return true;
  } catch { return false; }
}
async function syncReminders() {
  if (!sb || !session || !S.pushOn) return;
  const s = S.settings, [h, m] = s.time.split(':').map(Number), now = new Date(), { streak } = stats(), rows = [];
  if (s.on) for (let i = 0; i < 45; i++) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, h, m, 0);
    if (d <= now || (i === 0 && S.checkins[key(d)]) || dayInfo(d).exempt) continue;
    rows.push({ user_id: session.user.id, day: key(d), fire_at: d.toISOString(),
      body: streak ? `Llevas ${streak} día${streak === 1 ? '' : 's'} de racha. ¡No la rompas!` : 'Empieza tu racha hoy.' });
  }
  await sb.from('reminders').delete().eq('user_id', session.user.id).eq('sent', false);
  if (rows.length) await sb.from('reminders').upsert(rows, { onConflict: 'user_id,day' });
}

// Compartir la foto con grupos (se sube, caduca y se borra sola)
function shareSheet() {
  return new Promise(res => {
    const on = new Set(groups.map(g => g.id));
    overlay.className = 'on';
    const paint = () => {
      overlay.innerHTML = `<div class="sheet"><div class="grp"><div class="t">Compartir tu foto con… (desaparece en ${S.settings.ttl} h)</div>${
        groups.map(g => `<button class="gsel ${on.has(g.id) ? 'on' : ''}" data-id="${esc(g.id)}">${on.has(g.id) ? '✓' : '○'}  ${esc(g.name)}</button>`).join('')
      }<button class="bold" data-go>Compartir</button></div><div class="grp"><button data-no>No compartir</button></div></div>`;

async function postPhoto(blob, groupIds) {
  const uid = session.user.id, path = `${uid}/${Date.now()}.jpg`, ttl = S.settings.ttl;
  const up = await sb.storage.from('checkins').upload(path, blob, { contentType: 'image/jpeg' });
  if (up.error) return alertBox('No se pudo subir', up.error.message);
  const expires = new Date(Date.now() + ttl * 3600_000).toISOString(), { streak } = stats();
  const { error } = await sb.from('group_posts').insert(groupIds.map(group_id => ({ group_id, user_id: uid, photo_path: path, streak, expires_at: expires })));
  if (error) return alertBox('No se pudo compartir', error.message);
  alertBox('¡Compartido! 📸', `Tu foto desaparecerá en ${ttl} h.`);
}

/* =========================================================
   Efectos visuales
   · GSAP  (greensock/GSAP)          → entradas, anillo, contador, aurora
   · Lenis (darkroomengineering)     → scroll suave
   · React Bits (DavidHDev) portado a JS puro:
       Aurora, Particles, GradientText, ShinyText, CountUp, SpotlightCard, Magnet
   ========================================================= */
const G = window.gsap, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let lenis = null;

function onScroll() {
  const y = $('#screen').scrollTop;
  $('#topbar').style.opacity = Math.max(0, Math.min(1, (y - 50) / 30));
}
$('#screen').addEventListener('scroll', onScroll, { passive: true });

function initLenis() {
  if (!window.Lenis || reduce) return;
  lenis = new Lenis({ wrapper: $('#screen'), content: $('#content'), duration: 1.15, smoothWheel: true,
    easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
  if (G) { G.ticker.add(t => lenis.raf(t * 1000)); G.ticker.lagSmoothing(0); }
  else { const f = t => { lenis.raf(t); requestAnimationFrame(f); }; requestAnimationFrame(f); }
}

// entrada escalonada + anillo y contador de la racha (CountUp)
function animateIn(fresh) {
  if (!G || reduce) return;
  if (fresh) G.from([...$('#content').children], { y: 30, opacity: 0, scale: .97, duration: .75, stagger: .07, ease: 'power3.out', clearProps: 'transform,opacity' });
  const hero = $('.hero'); if (!hero) return;
  const n = +hero.dataset.streak, C = +hero.dataset.c, off = +hero.dataset.off, num = $('.num', hero), o = { v: 0 };
  num.textContent = 0;
  G.fromTo('.ring .fg', { strokeDashoffset: C }, { strokeDashoffset: off, duration: 1.4, ease: 'power3.out', delay: .15 });
  G.to(o, { v: n, duration: 1.3, ease: 'power2.out', delay: .15, onUpdate: () => { num.textContent = Math.round(o.v); } });
  G.fromTo('.flame', { scale: .4, rotate: -20 }, { scale: 1, rotate: 0, duration: .9, ease: 'elastic.out(1,.5)' });
}

// aurora: manchas de color a la deriva
function initAurora() {
  if (!G || reduce) return;
  document.querySelectorAll('#aurora i').forEach((el, i) => {
    const drift = () => G.to(el, { x: G.utils.random(-70, 70), y: G.utils.random(-90, 90), scale: G.utils.random(.85, 1.3),
      duration: G.utils.random(7, 12), ease: 'sine.inOut', onComplete: drift });
    drift();
  });
}

// partículas (brasas doradas) + confeti
const conf = $('#confetti'), cctx = conf.getContext('2d');
let W = 390, H = 844, bits = [];
function fitCanvases() {
  const r = $('#phone').getBoundingClientRect(); W = conf.width = r.width; H = conf.height = r.height;
}
fitCanvases(); addEventListener('resize', fitCanvases);
const rnd = (a, b) => a + Math.random() * (b - a);
function frame() {
  cctx.clearRect(0, 0, W, H);
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.vy += .22; b.vx *= .992; b.x += b.vx; b.y += b.vy; b.rot += b.vr; b.life--;
    if (b.life <= 0 || b.y > H + 20) { bits.splice(i, 1); continue; }
    cctx.save(); cctx.translate(b.x, b.y); cctx.rotate(b.rot); cctx.globalAlpha = Math.min(1, b.life / 30);
    cctx.fillStyle = b.c; cctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); cctx.restore();
  }
  requestAnimationFrame(frame);
}
function burst() {
  if (reduce) return;
  const el = $('#statuscard') || $('.hero'), pr = $('#phone').getBoundingClientRect(), r = el.getBoundingClientRect();
  const x = r.left - pr.left + r.width / 2, y = r.top - pr.top + r.height / 2, cols = ['#FFE08A', '#FFB62E', '#FF7A3D', '#fff', '#8AB4FF', '#B58CFF'];
  for (let i = 0; i < 110; i++) {
    const a = rnd(0, Math.PI * 2), s = rnd(4, 13);
    bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, rot: rnd(0, 6), vr: rnd(-.3, .3), w: rnd(5, 10), h: rnd(3, 6), c: cols[i % cols.length], life: rnd(70, 130) });
  }
}

// SpotlightCard: el foco sigue al puntero · Magnet: el botón atrae al puntero
let magnet = null;
$('#screen').addEventListener('pointermove', e => {
  const c = e.target.closest('.card');
  if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', e.clientX - r.left + 'px'); c.style.setProperty('--my', e.clientY - r.top + 'px'); }
  const b = e.target.closest('.btn');
  if (magnet && magnet !== b) { G?.to(magnet, { x: 0, y: 0, duration: .6, ease: 'elastic.out(1,.4)' }); magnet = null; }
  if (b && G && !reduce) {
    const r = b.getBoundingClientRect(); magnet = b;
    G.to(b, { x: (e.clientX - r.left - r.width / 2) * .12, y: (e.clientY - r.top - r.height / 2) * .3, duration: .35, ease: 'power2.out' });
  }
});
$('#screen').addEventListener('pointerleave', () => { if (magnet) { G?.to(magnet, { x: 0, y: 0, duration: .6 }); magnet = null; } });

/* ---------- arranque ---------- */
const tick = () => { $('#clock').textContent = new Date().toLocaleTimeString('es', { hour: 'numeric', minute: '2-digit', hour12: false }); };
tick(); setInterval(tick, 15000);
let lastDay = key(new Date());
setInterval(() => { const k = key(new Date()); if (k !== lastDay) { lastDay = k; if (!chat) render(); } }, 30000);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
initLenis(); initAurora(); requestAnimationFrame(frame);
render();
initSupabase();
</script>
